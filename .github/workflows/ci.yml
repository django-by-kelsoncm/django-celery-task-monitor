name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: "Python ${{ matrix.python-version }} / Django ${{ matrix.django-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        django-version: ["4.2", "5.0", "5.1"]
        exclude:
          # Django 5.x exige Python >= 3.10, mas o suporte a 5.1 começa em
          # versões de Python mais recentes que o mínimo do projeto.
          - python-version: "3.10"
            django-version: "5.1"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install "Django~=${{ matrix.django-version }}.0"

      - name: Run tests
        run: pytest

      - name: Check example project
        run: |
          cd example
          python manage.py check
          python manage.py makemigrations --check --dry-run

  lint:
    name: Lint (black, flake8, mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: black --check
        run: black --check django_celery_task_monitor tests example

      - name: flake8
        run: flake8 django_celery_task_monitor tests example

      - name: mypy
        run: mypy django_celery_task_monitor
