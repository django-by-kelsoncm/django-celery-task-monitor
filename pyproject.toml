[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-celery-task-monitor"
version = "0.1.0"
description = "Monitoramento de tarefas Celery no Django Admin, com polling via REST."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Kelson C. Medeiros", email = "kelsoncm@gmail.com" }]
requires-python = ">=3.10"
keywords = ["django", "celery", "admin", "monitoring", "async", "tasks"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["django-celery-results>=2.5"]

[project.optional-dependencies]
dev = [
    "django>=4.2",
    "celery>=5.3",
    "pytest>=7.4",
    "pytest-django>=4.7",
    "black>=24.0",
    "flake8>=7.0",
    "mypy>=1.8",
    "django-stubs>=4.2",
    "build>=1.0",
    "twine>=5.0",
]
docs = ["sphinx>=7.2", "django_docs_theme>=0.1.0"]

[project.urls]
Homepage = "https://github.com/django-by-kelsoncm/django-celery-task-monitor"
Repository = "https://github.com/django-by-kelsoncm/django-celery-task-monitor"
Issues = "https://github.com/django-by-kelsoncm/django-celery-task-monitor/issues"
Documentation = "https://django-by-kelsoncm.github.io/django-celery-task-monitor/"

[tool.setuptools.packages.find]
include = ["django_celery_task_monitor*"]
exclude = ["tests*", "example*", "docs*"]

[tool.setuptools.package-data]
django_celery_task_monitor = [
    "static/django_celery_task_monitor/**/*",
    "templates/django_celery_task_monitor/**/*",
    "locale/**/*",
]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.mypy]
python_version = "3.10"
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
exclude = ["example/", "docs/"]

[tool.django-stubs]
django_settings_module = "tests.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
